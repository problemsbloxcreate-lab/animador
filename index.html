<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMADOR · Estúdio Problems</title>
<link rel="icon" href="icones/simbolo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icones/icone-192.png">
<script src="/estudio-carregando.js" data-so-progresso></script><!-- porcentagem e o que está carregando na tela de carregamento -->
<meta name="theme-color" content="#232323">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- ====================== TELA INICIAL ====================== -->
<div id="home" class="screen">
  <header class="bar">
    <div class="brand" id="home-brand" title="Início"><span class="logo logo-ep" data-estudio-icone="an"></span><span><b>ANIMADOR</b><small>Estúdio Problems</small></span></div>
    <span class="sp"></span><span data-estudio-conta></span>
  </header>
  <div class="home"><div class="home-in" id="home-in"></div></div>
</div>

<!-- ====================== ANIMADOR ====================== -->
<div id="editor" class="screen hidden">
  <header class="bar">
    <div class="brand" id="ed-inicio" title="Voltar ao início (as animações ficam salvas)"><span class="logo logo-ep" data-estudio-icone="an"></span><span><b>ANIMADOR</b><small>Estúdio Problems</small></span></div>
    <span class="sep"></span>
    <div class="proj-nome"><b id="proj-nome" title="Clique para renomear"></b><span class="salvo" id="salvo"></span></div><button class="btn sm" id="b-junto" title="Trabalhar junto ao vivo: outras pessoas da equipe entram, cada uma com o cursor e o nome, e veem as mudanças na hora"></button><span class="aovivo-barra" data-aovivo="animador" hidden></span>
    <span class="sep"></span>
    <button class="ibtn" id="b-undo" title="Desfazer (Ctrl+Z)"></button><button class="ibtn" id="b-redo" title="Refazer (Ctrl+Y)"></button>
    <span class="sp"></span>
    <div class="ferr" title="Ferramentas">
      <button class="ibtn on" data-ferr="mover" title="Mover, girar e tamanho (V)"></button>
      <button class="ibtn" data-ferr="mao" title="Mão: arrastar a tela (H, ou botão do meio)"></button>
      <button class="ibtn" data-ferr="camera" title="Câmera: arrastar para enquadrar (C)"></button>
    </div>
    <div class="ferr" title="O que o palco mostra (Tab)">
      <button class="btn sm ghost on" data-vista="mundo" title="Canvas infinito, para montar a cena">Cena</button>
      <button class="btn sm ghost" data-vista="camera" title="Só o que a câmera vê, com cor, efeitos e legendas (igual ao vídeo)">Câmera</button>
    </div>
    <button class="ibtn" id="b-onion" title="Casca de cebola: ver os quadros vizinhos (O)"></button><button class="ibtn" id="b-regua" title="Régua e ímã: gruda nas bordas da câmera e nos outros personagens/objetos (R) · segure Ctrl para soltar sem grudar"></button>
    <span class="sep"></span>
    <button class="btn ia" id="b-ia" title="Animar com a IA"></button>
    <button class="btn" id="b-atelie" title="Ateliê de personagens: montar partes, sessões e poses"></button>
    <button class="btn primary" id="b-exportar"></button>
    <span data-estudio-conta></span>
  </header>
  <div class="area">
    <aside class="painel esq">
      <div class="p-cab" id="midia-cab"><h3>Mídia</h3><small class="esq-sub">imagens para reaproveitar</small><span class="sp"></span></div>
      <div class="p-corpo midia-corpo" id="midia-corpo"></div>
      <div class="p-cab"><h3>Hierarquia</h3><span class="sp"></span>
        <button class="ibtn" id="h-pers" title="Pôr um personagem da biblioteca"></button><button class="ibtn ia" id="h-cen" title="Pôr um cenário (prontos ou feito pela IA no estilo da casa)"></button><button class="ibtn" id="h-img" title="Pôr uma imagem (objeto, cenário próprio)"></button>
        <button class="ibtn" id="h-forma" title="Pôr uma forma (retângulo, círculo, triângulo, estrela)"></button><button class="ibtn" id="h-txt" title="Pôr um texto"></button><button class="ibtn" id="h-pasta" title="Pasta nova (Ctrl+G põe o selecionado numa pasta)"></button></div>
      <div class="p-corpo arvore" id="arvore"></div>
    </aside>
    <main class="palco" id="palco"><canvas id="palco-cv"></canvas>
      <div class="palco-zoom"><button class="btn sm" id="z-menos">−</button><button class="btn sm" id="zoom-txt" title="Enquadrar a câmera (F)">100%</button><button class="btn sm" id="z-mais">+</button></div>
    </main>
    <aside class="painel dir">
      <div class="abas" id="lado-abas"><button data-aba="props" class="on">Propriedades</button><button data-aba="efeitos">Efeitos</button><button data-aba="som">Voz</button><button data-aba="quadro" class="aba-menos" title="Poses, vista e animações dos personagens neste quadro">No quadro</button></div>
      <div class="p-corpo" id="lado"></div>
    </aside>
    <section class="tl">
      <div class="tl-barra">
        <button class="ibtn" id="t-ini" title="Primeiro quadro (Home)"></button><button class="ibtn" id="t-ant" title="Quadro anterior ( , )"></button>
        <button class="ibtn" id="b-tocar" title="Tocar / pausar (Espaço)"></button>
        <button class="ibtn" id="t-prox" title="Próximo quadro ( . )"></button><button class="ibtn" id="t-fim" title="Último quadro (End)"></button>
        <span class="qd" id="tl-q"></span>
        <span class="sep"></span>
        <label title="Quadros por segundo" style="color:var(--tx2);display:flex;gap:4px;align-items:center">fps <input type="number" id="tl-fps" min="1" max="60"></label>
        <label title="Quantos quadros a animação tem" style="color:var(--tx2);display:flex;gap:4px;align-items:center">quadros <input type="number" id="tl-dur" min="1" max="20000" style="width:70px"></label>
        <button class="ibtn on" id="t-loop" title="Repetir ao tocar"></button>
        <span class="sep"></span>
        <button class="btn sm" id="t-chave" title="Chave neste quadro na camada escolhida (K)"></button>
        <button class="btn sm" id="t-tira" title="Tirar a chave deste quadro (Shift+K)"></button>
        <span class="sp"></span>
        <span class="tl-leg" style="color:var(--tx3);font-size:11.5px" title="O desenho da chave mostra como o movimento chega nela: ◆ suave · ■ linear · ▮ corte seco · ● curva própria (botão direito na chave para mudar). [ e ] pulam de chave em chave.">◆ chave · <span style="color:#ffd36b">◆</span> pose/expressão · [ ] pula chaves</span>
        <input type="range" id="tl-zoom" min="6" max="48" value="16" title="Largura dos quadros (Ctrl + rodinha)" style="width:110px;min-width:50px;flex:0 1 110px">
      </div>
      <div class="tl-corpo"><div class="tl-nomes" id="tl-nomes"></div><div class="tl-grade" id="tl-grade"><canvas id="tl-cv"></canvas><div class="tl-espaco" id="tl-espaco"></div></div></div>
    </section>
  </div>
</div>

<!-- ====================== ATELIÊ DE PERSONAGENS ====================== -->
<div id="atelie" class="screen hidden">
  <header class="bar">
    <button class="btn ghost" id="at-voltar" title="Voltar"></button>
    <div class="brand"><span class="logo logo-atelie logo-ep" data-estudio-icone="at"></span><span><b>ATELIÊ</b><small>personagens · Animador</small></span></div>
    <span class="sep"></span>
    <button class="at-icone" id="at-icone" title="Ícone e cor do personagem (aparecem na hierarquia do editor)"></button>
    <input type="text" id="at-nome" title="Nome do personagem" style="width:180px;font-weight:600">
    <label style="color:var(--tx2);display:flex;gap:6px;align-items:center" title="Pasta na biblioteca da equipe">Pasta<input type="text" id="at-pasta" style="width:140px"></label>
    <button class="ibtn" id="at-undo" title="Desfazer (Ctrl+Z)"></button><button class="ibtn" id="at-redo" title="Refazer (Ctrl+Shift+Z)"></button>
    <span class="sp"></span>
    <span id="at-autores" class="at-autores"></span>
    <button class="ibtn" id="at-backup" title="Baixar backup do personagem (.atelieanimador)"></button>
    <span class="aovivo-barra" data-aovivo="atelie" hidden></span><span id="at-estado" class="at-estado"></span>
    <button class="btn" id="at-cor" title="Cor interna do personagem: troca o branco do preenchimento pela cor que você quiser"></button>
    <button class="btn ia" id="at-ia" title="IA do Ateliê: criar presets e expressões a partir das peças"></button>
    <button class="btn primary" id="at-salvar" title="Salvar na nuvem da equipe (Ctrl+S)"></button>
    <span data-estudio-conta></span>
  </header>
  <div class="at">
    <aside class="painel" style="border-right:1px solid var(--bd)">
      <div class="at-vistas" id="at-vistas"></div>
      <div class="p-cab"><h3 title="Em cima = atrás, embaixo = na frente · arraste: em cima de outra = atrás dela, embaixo = na frente · no meio vira filha · no vazio (ou longe) fica sem pai">Partes</h3><span class="sp"></span><button class="btn sm" id="at-add-parte" title="Parte nova encaixada na escolhida">+ Parte</button></div>
      <div class="p-corpo arvore at-partes" id="at-partes" style="flex:1.2"></div>
      <div class="p-cab" style="border-top:1px solid var(--bd)"><h3 id="at-imgs-t">Imagens</h3><span class="sp"></span><button class="btn sm" id="at-add-pasta" title="Pasta nova nas imagens desta parte (ex.: olhos, bocas)">+ Pasta</button><button class="btn sm" id="at-add-img" title="Pôr imagens (PNG com fundo transparente) nesta parte. Também dá para arrastar os arquivos para cá">+ Imagens</button></div>
      <div class="p-corpo imgs" id="at-imgs" style="flex:1;align-content:start"></div>
    </aside>
    <main class="at-palco"><canvas id="at-cv"></canvas>
      <div class="ferr-at" id="at-ferr" title="Ferramentas"></div>
      <div class="modo-at"><span class="at-status" id="at-modo"></span><button class="btn sm" id="at-base" title="Sair desta pose e voltar à pose padrão">Voltar à padrão</button><button class="btn sm primary" id="at-ed-ok" hidden title="Voltar ao Ateliê (Esc)">Concluir</button><span class="sp"></span>
        <select id="at-mover" class="at-sel" title="O que arrastar uma peça muda"><option value="preset">Arrastar: só nesta pose</option><option value="imagem">Arrastar: imagem em todas</option><option value="todos">Arrastar: parte inteira</option></select>
        <button class="ibtn at-ib" id="at-enq" title="Enquadrar o personagem"></button><button class="ibtn at-ib" id="at-regua" title="Régua e ímã: a peça gruda nas bordas e no meio das outras e no centro (R) · Ctrl segura para não grudar"></button><button class="ibtn at-ib" id="at-osso" title="Esqueleto: mostra os ossos e as juntas. Arraste a bolinha laranja de uma mão/pé para dobrar o braço/perna inteiro (IK; Alt dobra para o outro lado) ou uma bolinha azul para girar a parte de cima dela"></button><button class="ibtn at-ib" id="at-ref" title="Pôr cada peça no lugar da referência (a parte &quot;Referência&quot; ou o Fantasma)"></button>
        <button class="ibtn at-ib" id="at-ajuda" title="Arrastar: posiciona · Alt+arrastar: muda o pivô (giro) · Ctrl+arrastar: gira · setas, Q/E girar, +/− tamanho, F espelhar, [ ] frente/trás, Tab próxima parte, H esconder · espaço/botão do meio: mover a tela · dois cliques numa peça ou imagem: editar a imagem · P toca/pausa a animação, , e . andam um passo">?</button></div>
      <div class="at-tl" id="at-tl"></div>
    </main>
    <aside class="painel" style="border-left:1px solid var(--bd)">
      <div class="abas" id="at-abas"><button data-aba="peca" class="on">Peça</button><button data-aba="sessoes" title="Sessões (olhos, boca, braços…) e as poses de cada uma">Poses</button><button data-aba="animacoes">Animações</button></div>
      <div class="p-corpo" id="at-lado"></div>
    </aside>
  </div>
</div>

<div id="modal-root"></div><div id="ctx-root"></div><div id="toast-root"></div>

<script>/* itens do Animador no balão da conta (o resto é igual em todos os projetos) */
window.ESTUDIO_CONTA = { nuvem: true, // círculo roxo: espaço na nuvem da equipe (personagens e cenários salvos na nuvem)
  token: () => TurmaAuth.token(), // o login do Google (o círculo da nuvem precisa dele para medir)
  aoMudarNuvem: () => { try { if (typeof Home !== 'undefined' && document.querySelector('#home:not(.hidden)')) Home.pinta(); } catch { } },
  extras: () => [
  typeof App !== 'undefined' && App.P && document.querySelector('#editor:not(.hidden)') && { texto: 'Citar este quadro em mensagens…', icone: 'msg', acao: () => Citacao.animacao(App.P, App.q, App.sel) },
  typeof Atelie !== 'undefined' && Atelie.def && document.querySelector('#atelie:not(.hidden)') && { texto: 'Citar este personagem em mensagens…', icone: 'msg', acao: () => Citacao.atelie() },
] };</script>
