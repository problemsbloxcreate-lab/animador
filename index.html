<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMADOR · Estúdio Problems</title>
<link rel="icon" href="icones/icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17181c">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Fredoka:wght@400;700&family=Luckiest+Guy&family=Montserrat:wght@400;700&family=Permanent+Marker&family=Poppins:wght@400;700&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="home" class="screen"></div>

<div id="editor" class="screen hidden">
  <header class="menubar">
    <div class="brand" id="btn-home" title="Voltar à tela inicial"><span class="logo logo-ep"><img src="icones/icone-192.png" alt=""></span><span><b>ANIMADOR</b> <i class="brand-mod">Estúdio Problems</i></span></div>
    <div class="ep-modo" id="ep-modo"><button data-m="edicao" class="on" title="Edição do vídeo">Edição</button><button data-m="ossos" title="Abrir o personagem selecionado nos ossos (tela cheia)">Ossos</button></div>
    <nav class="menus" id="menus"></nav>
    <div class="proj-title" id="proj-title"><span id="proj-name" title="Clique para renomear"></span><span class="save-state" id="save-state" title="Clique para salvar agora"></span><span class="proj-meta" id="proj-meta"></span></div>
    <div class="menu-actions">
      <button class="ibtn" id="btn-undo" title="Desfazer (Ctrl+Z)"></button>
      <button class="ibtn" id="btn-redo" title="Refazer (Ctrl+Y)"></button>
      <button class="btn ai-btn" id="btn-ai" title="Assistente: peça e ele anima pra você (Ctrl+J)"></button>
      <button class="btn" id="btn-save" title="Salvar neste computador (Ctrl+S)"></button>
      <button class="btn" id="btn-toon" title="Salvar arquivo .toon com todas as mídias (Ctrl+Shift+S)"></button>
      <button class="btn primary" id="btn-export" title="Exportar vídeo (Ctrl+E)"></button>
      <span data-estudio-conta></span><!-- foto, nome e conta do menu -->
    </div>
  </header>

  <aside class="panel left">
    <div class="ptabs" id="lib-tabs"></div>
    <div class="psearch"><input id="lib-search" placeholder="Buscar..." autocomplete="off"></div>
    <div class="pbody" id="lib-body"></div>
    <div class="splitter-v" id="split-l" title="Arraste para mudar a largura"></div>
  </aside>

  <main class="center">
    <div class="pv-toolbar">
      <button class="btn sm" id="pv-autokey" title="Modo animar (A): tudo que você mexer na prévia ou nos valores vira keyframe no tempo do cursor"></button>
      <div class="pv-modo" id="pv-modo" title="O que o mouse faz na prévia"><button data-v="mover" title="Mover, girar e escalar os clipes">✋ Mover</button><button data-v="ossos" title="Mexer nos ossos do personagem selecionado">🦴 Ossos</button><button data-v="desenhar" title="Pincel, lápis, borracha, balde, quadro a quadro">✏️ Desenhar</button><button data-v="camera" title="Mexer e animar a câmera: arrastar = mover, Shift = zoom, Alt = girar">🎥 Câmera</button></div>
      <div class="vsep"></div>
      <button class="btn sm pv-tg" id="pv-outside" title="Mostrar o que está fora do quadro (área em volta)"></button>
      <button class="btn sm" id="pv-center" title="Centralizar a câmera na tela (rodinha = zoom, botão do meio ou Espaço + arrastar = andar)" style="display:none">⤢</button>
      <button class="btn sm pv-tg" id="pv-guides" title="Guias de área segura"></button>
      <button class="btn sm pv-tg" id="pv-final" title="Mostra um quadrinho com o resultado final (como vai sair no vídeo)"></button>
      <button class="ibtn" id="pv-snapshot" title="Salvar uma foto (PNG) deste quadro"></button>
      <div class="sp"></div>
      <span class="pv-info" id="pv-info"></span>
    </div>
    <div class="pv-final" id="pv-final-box"><b>Resultado final</b><canvas id="pv-final-cv"></canvas></div><div class="pv-stage" id="pv-stage"><div class="pv-wrap" id="pv-wrap"><canvas id="pv-canvas"></canvas><canvas id="pv-overlay"></canvas></div></div>
    <div class="transport">
      <div class="tp-time"><span id="tp-cur">00:00:00</span><span class="tp-sep">/</span><span id="tp-dur">00:00:00</span></div>
      <div class="tp-btns">
        <button class="ibtn" id="tp-start" title="Ir para o início (Home)"></button>
        <button class="ibtn" id="tp-prev" title="Quadro anterior (←)"></button>
        <button class="ibtn play-btn" id="tp-play" title="Reproduzir / Pausar (Espaço)"></button>
        <button class="ibtn" id="tp-next" title="Próximo quadro (→)"></button>
        <button class="ibtn" id="tp-end" title="Ir para o fim (End)"></button>
        <button class="ibtn" id="tp-loop" title="Repetir (loop)"></button>
      </div>
      <div class="tp-right"><select id="pv-zoom" title="Zoom da prévia">        <option value="fit">Ajustar</option><option value="0.25">25%</option><option value="0.5">50%</option>        <option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option>      </select>      <select id="pv-quality" title="Qualidade da prévia (não afeta a exportação)">        <option value="auto">Qualidade: Auto</option><option value="1">Completa</option><option value="0.5">Metade</option><option value="0.25">Um quarto</option>      </select><span id="tp-vol-ic"></span><input type="range" id="tp-vol" min="0" max="1" step="0.01" value="1" title="Volume da prévia"></div>
    </div>
  </main>

  <aside class="panel right"><div class="pbody" id="props"></div><div class="splitter-v" id="split-r" title="Arraste para mudar a largura"></div></aside>
  <div class="splitter-h" id="split-tl" title="Arraste para redimensionar a linha do tempo"></div>
  <section id="timeline"></section>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="ctx-root"></div>

<script src="js/tema.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/util.js"></script>
<script src="js/pwa.js"></script>
<script src="js/estudio.js"></script>
<script src="js/library.js"></script>
<script src="js/genre.js"></script>
<script src="js/db.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/timeline.js"></script>
<script src="js/props.js"></script>
<script src="js/libui.js"></script>
<script src="js/app.js"></script>
<script src="js/actions.js"></script>
<script src="js/mp4mux.js"></script>
<script src="js/export.js"></script>
<script src="js/picker.js"></script>
<script src="js/keys.js"></script>
<script src="js/styleref.js"></script>
<script src="js/transcribe.js"></script>
<script src="js/assistant.js"></script>
<script src="js/creator.js"></script>
<script src="js/extras.js"></script>
<script src="js/animacao.js"></script>
<script src="js/alinhar.js"></script>
<script src="js/anim/rig.js"></script>
<script src="js/imgedit.js"></script>
<script src="js/anim/acting.js"></script>
<script src="js/anim/montar.js"></script>
<script src="js/anim/desenho.js"></script>
<script src="js/desenho-editor.js"></script>
<script src="js/camera-editor.js"></script>
<script src="js/timeline-animacao.js"></script>
<script src="js/cena.js"></script>
<script src="js/paineis.js"></script>
<script src="js/cor.js"></script>
<script src="js/ia-corrigir.js"></script>
<script src="js/limpar-audio.js"></script>
<script src="js/rigedit.js"></script>
<script src="js/team.js"></script>
<script src="js/home.js"></script>
<script>/* itens do Animador no balão da conta (o resto é igual em todos os projetos) */
window.ESTUDIO_CONTA = { extras: () => [
  typeof PWA !== 'undefined' && { texto: PWA.installed ? 'Já está como programa ✓' : 'Usar como programa (instalar)…', icone: 'tela', acao: () => PWA.install() },
  typeof Tema !== 'undefined' && { texto: 'Tema e cores…', icone: 'paleta', acao: () => Tema.open() },
] };</script>
<script src="/estudio-conta.js" defer></script>
<script>
/* círculo de espaço (padrão de todos os projetos): os projetos do Animador, com "Baixar .toon" */
addEventListener('DOMContentLoaded', () => window.EstudioConta?.espaco.registrar({
  programa: 'Animador',
  async listar() {
    if (App.project && App.dirty) await App.save(true);
    const [ps, as] = await Promise.all([DB.all('projects'), DB.all('assets')]), tam = {};
    as.forEach(a => tam[a.projectId] = (tam[a.projectId] || 0) + (a.size || a.blob?.size || 0));
    return ps.sort((a, b) => b.modified - a.modified).map(p => ({ nome: p.name, bytes: (p.data?.length || 0) + (p.thumb?.length || 0) + (tam[p.id] || 0), data: p.modified, thumb: p.thumb,
      info: p.kind === 'anim' ? 'animação' : 'vídeo', rotuloBaixar: 'Baixar .toon', baixar: () => Home.exportToon(p), apagar: () => Home.remove(p), confirma: false }));
  },
  detalhes: () => Home.storageModal(),
}));
</script>
</body>
</html>
