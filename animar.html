<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMADOR · Estúdio Problems</title>
<link rel="icon" href="icones/icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17181c">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Fredoka:wght@400;700&family=Luckiest+Guy&family=Montserrat:wght@400;700&family=Permanent+Marker&family=Poppins:wght@400;700&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/anim.css">
</head>
<body class="anim-app">
<div id="anim" class="an-root">
  <header class="menubar an-bar">
    <div class="brand" id="an-home" title="Voltar ao editor"><span class="logo logo-ep"><img src="icones/icone-192.png" alt=""></span><span><b>ANIMADOR</b> <i class="brand-mod">Estúdio Problems</i></span></div>
    <div class="ep-modo" id="ep-modo"><button data-m="edicao" title="Voltar para a cena (canvas)">🎨 Cena</button><button data-m="ossos" class="on" title="Só o personagem (rig e precisão)">🔍 Só o personagem</button></div>
    <nav class="menus" id="an-menus"></nav>
    <div class="an-modes" id="an-modes"></div>
    <div class="proj-title"><span id="an-name" title="Clique para renomear"></span><span class="save-state" id="an-save"></span></div>
    <div class="menu-actions">
      <button class="ibtn" id="an-undo" title="Desfazer (Ctrl+Z)"></button>
      <button class="ibtn" id="an-redo" title="Refazer (Ctrl+Y)"></button>
      <button class="btn ai-btn" id="an-ai" title="IA de animação: anima pela fala no estilo Disney TV"></button>
      <button class="btn" id="an-file" title="Salvar arquivo .tanim (leva todas as imagens e áudios)"></button>
      <button class="btn primary" id="an-export" title="Exportar o vídeo (MP4)"></button>
      <span data-estudio-conta></span><!-- foto, nome e conta do menu -->
    </div>
  </header>
  <nav class="an-strip" id="an-strip"></nav>
  <aside class="panel left an-left"><div class="ptabs" id="an-ltabs"></div><div class="pbody" id="an-lbody"></div></aside>
  <main class="center an-center">
    <div class="pv-toolbar an-tools" id="an-tools"></div>
    <div class="an-stage" id="an-stage"><canvas id="an-canvas"></canvas><div class="an-hint" id="an-hint"></div></div>
    <div class="an-status" id="an-status"></div>
  </main>
  <aside class="panel right an-right"><div class="pbody" id="an-props"></div>
    <div class="an-prev" id="an-prev"><div class="an-prev-h"><b>📺 Resultado final</b><select id="an-prev-m"></select><span class="sp"></span><small id="an-prev-t"></small><button class="ibtn xs" id="an-prev-x" title="Esconder/mostrar">−</button></div><div class="an-prev-c"><canvas id="an-prev-cv"></canvas></div></div></aside>
  <section class="an-tl" id="an-tl"></section>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="ctx-root"></div>

<script src="js/tema.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/util.js"></script>
<script src="js/pwa.js"></script>
<script src="js/estudio.js"></script>
<script src="js/library.js"></script>
<script src="js/genre.js"></script>
<script src="js/db.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/timeline.js"></script>
<script src="js/props.js"></script>
<script src="js/libui.js"></script>
<script src="js/app.js"></script>
<script src="js/actions.js"></script>
<script src="js/mp4mux.js"></script>
<script src="js/export.js"></script>
<script src="js/picker.js"></script>
<script src="js/keys.js"></script>
<script src="js/styleref.js"></script>
<script src="js/transcribe.js"></script>
<script src="js/assistant.js"></script>
<script src="js/creator.js"></script>
<script src="js/extras.js"></script>
<script src="js/animacao.js"></script>
<script src="js/alinhar.js"></script>
<script src="js/team.js"></script>
<script src="js/anim/rig.js"></script>
<script src="js/cor.js"></script>
<script src="js/imgedit.js"></script>
<script src="js/anim/montar.js"></script>
<script src="js/anim/acting.js"></script>
<script src="js/anim/antimeline.js"></script>
<script src="js/anim/folha.js"></script>
<script src="js/anim/desenho.js"></script>
<script src="js/anim/studioui.js"></script>
<script src="js/anim/studio.js"></script>
<script>/* itens do Animador no balão da conta (o resto é igual em todos os projetos) */
window.ESTUDIO_CONTA = { extras: () => [
  typeof PWA !== 'undefined' && { texto: PWA.installed ? 'Já está como programa ✓' : 'Usar como programa (instalar)…', icone: 'tela', acao: () => PWA.install() },
  typeof Tema !== 'undefined' && { texto: 'Tema e cores…', icone: 'paleta', acao: () => Tema.open() },
] };</script>
<script src="/estudio-conta.js" defer></script>
</body>
</html>
